# Mosquitto config — Phase 1 (plaintext) and Phase 2 (TLS) listeners.
#
# Mosquitto 2.x defaults to localhost-only + allow_anonymous false.
# Without this file's explicit listener/allow_anonymous lines, the ESP32
# cannot connect from another device on the network.

# --- Phase 1: plaintext, local network testing only ---
listener 1883
allow_anonymous true   # tighten this once device certs (Phase 2) are in place

# --- Phase 2: TLS listener (uncomment once certs/ is populated) ---
# listener 8883
# cafile   /path/to/certs/ca.crt
# certfile /path/to/certs/server.crt
# keyfile  /path/to/certs/server.key
# require_certificate true   # mutual TLS once device certs exist
# allow_anonymous false

persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
